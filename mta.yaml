_schema-version: "3.3"
ID: matchschedule
description: Match Schedule application.
version: 0.0.1

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  - name: matchschedule-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: matchschedule-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - matchschedule.zip
          name: matchschedule
          target-path: resources/

  - name: matchschedule
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: matchschedule-destination-content
    type: com.sap.application.content
    requires:
      - name: matchschedule-destination-service
        parameters:
          content-target: true
      - name: matchschedule-html5-repo-host
        parameters:
          service-key:
            name: matchschedule-html5-repo-host-key
    parameters:
      content:
        instance:
          destinations:
            - Name: matchschedule_repo_host
              ServiceInstanceName: matchschedule-html5-repo-host
              ServiceKeyName: matchschedule-html5-repo-host-key
              sap.cloud.service: match.schedule
              HTML5.DynamicDestination: true
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: matchschedule-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: matchschedule-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite